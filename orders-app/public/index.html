<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1b34">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="הזמנות">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="stylesheet" href="/style.css">
  <title>הזמנות — ארנה ישראל</title>
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1>הזמנות</h1>
      <button id="refresh" class="icon-btn" aria-label="רענון">↻</button>
    </div>
    <input id="search" type="search" placeholder="חיפוש לפי שם, טלפון או מספר הזמנה" autocomplete="off">
    <nav id="tabs" class="tabs" role="tablist"></nav>
  </header>

  <main id="list" class="list" aria-live="polite">
    <div class="empty">טוען…</div>
  </main>

  <div id="more-wrap" class="more-wrap hidden">
    <button id="more" class="more">עוד הזמנות</button>
  </div>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-label="פרטי הזמנה">
    <div class="sheet-bg" data-close></div>
    <div class="sheet-panel">
      <div class="sheet-grip" data-close></div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
